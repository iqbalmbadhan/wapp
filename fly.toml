# fly.toml app configuration file generated for wapp-pt-hgg on 2026-10-13T03:47:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wapp-pt-hgg'
primary_region = 'ams'

[build]

[env]
  AUTH_DIR = '/data/auth'
  DB_FILE = '/data/trackwapp.json'
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
