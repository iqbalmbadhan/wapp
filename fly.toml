# fly.toml — `app` must match your Fly app name
app = 'wapp-pt-hgg'
primary_region = 'ams'

[build]

[env]
  AUTH_DIR = '/data/auth'
  DB_FILE = '/data/trackwapp.json'
  PORT = '3000'

# persistent disk for the WhatsApp session + session log
[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000          # must match the PORT the app listens on
  force_https = true
  auto_stop_machines = 'off'    # must stay on to hold the WhatsApp connection
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
